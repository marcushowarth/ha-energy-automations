# Generated from a private Home Assistant config by export-public.py; edit there, not here.
# Personal IDs are replaced with YOUR_* placeholders; Octopus meter IDs with meterserial_* / gasmeterserial_*.

set_min_soc_to_10:
  alias: Set Min SoC to 10%
  sequence:
  - service: number.set_value
    target:
      entity_id: number.workshop_min_soc
    data:
      value: 10
  - service: number.set_value
    target:
      entity_id: number.workshop_min_soc_on_grid
    data:
      value: 10
  mode: single
  icon: mdi:battery-10
'1724255914837':
  alias: Free Electricity Day Tomorrow
  sequence:
  - wait_for_trigger:
    - at: 08:30:00
      trigger: time
    continue_on_timeout: false
    timeout:
      hours: 24
      minutes: 0
      seconds: 0
      milliseconds: 0
  - target:
      entity_id: select.workshop_work_mode
    data:
      option: Feed-in First
    action: select.select_option
  - data:
      enable_force_charge: true
      enable_charge_from_grid: true
      start: '{{ as_datetime(states(''input_datetime.free_electricity_start'')).strftime(''%H:%M:%S'')
        }}'
      end: '{{ as_datetime(states(''input_datetime.free_electricity_end'')).strftime(''%H:%M:%S'')
        }}'
      inverter: YOUR_INVERTER_DEVICE_ID
      charge_period: '2'
    action: foxess_modbus.update_charge_period
  - target:
      entity_id: number.workshop_max_soc
    data:
      value: '100'
    action: number.set_value
  - wait_for_trigger:
    - at: input_datetime.free_electricity_start
      trigger: time
    timeout:
      hours: 12
      minutes: 0
      seconds: 0
      milliseconds: 0
    continue_on_timeout: false
  - action: google_sheets.append_sheet
    continue_on_error: true
    data:
      config_entry: YOUR_GOOGLE_SHEETS_ENTRY_ID
      data:
        Log: Free Electricity Log
        Detail: 'Starting with: {{ states(''sensor.workshop_battery_soc'') }}% battery'
        Detail 2: Grid Consumption so far today = {{ states('sensor.workshop_grid_consumption_energy_today')
          }} KWh
  - data:
      message: 'Starting with: {{ states(''sensor.workshop_battery_soc'') }}% battery,
        Grid Consumption so far today = {{states(''sensor.workshop_grid_consumption_energy_today'')
        }} KWh'
      title: Free Electricity START
    action: notify.send_message
    target:
      entity_id: notify.email_me
  - wait_for_trigger:
    - at: input_datetime.free_electricity_end
      trigger: time
    timeout:
      hours: 12
      minutes: 0
      seconds: 0
      milliseconds: 0
    continue_on_timeout: true
  - target:
      entity_id: select.workshop_work_mode
    data:
      option: Self Use
    action: select.select_option
  - data:
      enable_force_charge: true
      enable_charge_from_grid: true
      start: '15:00:00'
      end: '15:55:00'
      inverter: YOUR_INVERTER_DEVICE_ID
      charge_period: '2'
    action: foxess_modbus.update_charge_period
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - data:
      enable_force_charge: false
      enable_charge_from_grid: true
      start: '15:00:00'
      end: '15:55:00'
      inverter: YOUR_INVERTER_DEVICE_ID
      charge_period: '2'
    action: foxess_modbus.update_charge_period
  - target:
      entity_id: number.workshop_max_soc
    data:
      value: '{{ states(''input_number.max_soc_day'') | float() }}'
    action: number.set_value
  - action: google_sheets.append_sheet
    continue_on_error: true
    data:
      config_entry: YOUR_GOOGLE_SHEETS_ENTRY_ID
      data:
        Log: Free Electricity Log
        Detail: 'Ending with: {{ states(''sensor.workshop_battery_soc'') }}% battery'
        Detail 2: Grid Consumption now = {{ states('sensor.workshop_grid_consumption_energy_today')
          }} KWh
  - data:
      message: 'Ending with with: {{ states(''sensor.workshop_battery_soc'') }}% battery,
        Grid Consumption now = {{states(''sensor.workshop_grid_consumption_energy_today'')
        }} KWh'
      title: Free Electricity END
    action: notify.send_message
    target:
      entity_id: notify.email_me
  mode: single
  icon: mdi:home-lightning-bolt
