- id: '1723828018073'
  alias: Adds row to spreadsheet and calender when batteries fully charged
  description: Logs to the Google Sheets integration
  triggers:
  - minutes: /5
    trigger: time_pattern
  conditions:
  - and:
    - condition: template
      value_template: '{{ states(''input_boolean.battery_full_today'') == ''off''
        }}'
    - condition: template
      value_template: '{{ states(''sensor.workshop_battery_soc'')|float(0) == 100
        }}'
  actions:
  - action: google_sheets.append_sheet
    continue_on_error: true
    data:
      config_entry: YOUR_GOOGLE_SHEETS_ENTRY_ID
      data:
        Log: Battery Log - fully charged
        Detail: '{% for state in states.weather -%} {%- if loop.first %}The {% elif
          loop.last %} and the {% else %}, the {% endif -%} {{ state.name | lower
          }} is {{state.state_with_unit}} {%- endfor %}.'
        Detail 2: '{% if is_state("sun.sun", "above_horizon") -%}  The sun rose {{
          relative_time(states.sun.sun.last_changed) }} ago. {%- else -%} The sun
          will rise at {{ as_timestamp(state_attr("sun.sun", "next_rising")) | timestamp_local
          }}. {%- endif %} '
  - data:
      entity_id: calendar.home_assistant
      summary: Batteries 100%
      start_date_time: '{{ now() }}'
      end_date_time: '{{ now() + timedelta(minutes=10) }}'
      location: '{{ states(''input_text.home_address'') }}'
    action: calendar.create_event
  - target:
      entity_id: input_boolean.battery_full_today
    data: {}
    action: input_boolean.turn_on
  - data:
      title: Batteries charged
      message: Batteries reached 100%
    action: notify.send_message
    target:
      entity_id: notify.email_me
  mode: single
