- id: '1727682293238'
  alias: 'Energy: Battery: Charge Reduction'
  description: 'This is a simple automation that sets the charge current to 4A above
    93% SoC and then increases it backs to 35A (the default max setting) when the
    battery drops below 90%.

    https://foxesscommunity.com/viewtopic.php?t=946'
  trigger:
  - platform: time_pattern
    minutes: /10
  condition:
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.workshop_battery_soc
      below: 90
    - condition: numeric_state
      entity_id: sensor.workshop_battery_soc
      above: 93
  action:
  - if:
    - condition: numeric_state
      entity_id: sensor.workshop_battery_soc
      above: 92
    then:
    - if:
      - condition: numeric_state
        entity_id: sensor.workshop_max_charge_current
        above: 10
      then:
      - service: number.set_value
        data:
          value: 4
        target:
          entity_id: number.workshop_max_charge_current
      - service: logbook.log
        data:
          message: Setting Max Charge to 4A
          name: Max Charge
    else:
    - if:
      - condition: numeric_state
        entity_id: sensor.workshop_battery_soc
        below: 90
      then:
      - if:
        - condition: numeric_state
          entity_id: sensor.workshop_max_charge_current
          below: 10
        then:
        - service: number.set_value
          data:
            value: 35
          target:
            entity_id: number.workshop_max_charge_current
        - service: logbook.log
          data:
            message: Setting Max Charge to 35A
            name: Max Charge
  mode: single
- alias: 'Energy: Battery: Max SoC according to the alternative cooking value'
  description: Sets the Max SoC according to the alternative cooking value
  triggers:
  - at: '14:55:00'
    variables:
      maxSoC: '{{ states(''input_number.max_soc_day_alternative_cooking'') | float(states(''number.workshop_min_soc''))
        }}'
    trigger: time
  conditions:
  - condition: template
    value_template: "{{ states('sensor.oven_today_s_consumption')|float(0) >=\n     states('input_number.energy_trigger_cooking')|float(0)
      }}"
  actions:
  - target:
      entity_id: number.workshop_max_soc
    data:
      value: '{{ maxSoC }}'
    action: number.set_value
  - data:
      message: "Oven current power: {{ states('sensor.oven_current_consumption') }} W,
        \ntoday's usage: {{ states('sensor.oven_today_s_consumption') }} kWh. \n\nWorkshop
        heater is currently using: {{ states('sensor.heater_current_consumption')
        }} W, \ntoday's usage: {{ states('sensor.heater_today_s_consumption') }} kWh.
        \n\nAs a result, Max SoC has been adjusted to {{ states('number.workshop_max_soc')
        }}% \n(instead of the usual {{ states('input_number.max_soc_day') }}% for
        daytime operation).\n\nBattery SoC is currently {{ states('sensor.workshop_battery_soc')
        }}%.\n\n{% set diff = states('sensor.workshop_battery_soc')|float(0) - states('number.workshop_max_soc')|float(0)
        %}\n\n{% if diff > 5 %}\n✅ The battery is comfortably {{ diff | round(1) }}%
        above the adjusted Max SoC — no additional charging is expected before the
        4 pm peak period.\n{% elif diff > 0 %}\n⚠️ The battery is only {{ diff | round(1)
        }}% above the adjusted Max SoC — monitor in case pre-peak charging is still
        required.\n{% else %}\n❗ The battery is {{ diff | abs | round(1) }}% **below**
        the target Max SoC — a top-up is likely needed before 4 pm peak begins.\n{%
        endif %}"
      title: Bumped up Max SoC Day as looks like we're cooking or using heater
    action: notify.send_message
    target:
      entity_id: notify.email_me
  mode: single
  id: '1733254185943'
- id: '1740657511428'
  alias: 'Energy: set Max SoC ECO based on tomorrow''s PV forecast'
  description: Sets the Max SoC ECO according to the forecast for tomorrow
  triggers:
  - at: '22:15:00'
    trigger: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.solcast_pv_forecast_forecast_tomorrow
        above: input_number.pv_forecasthigh_threshold
      sequence:
      - target:
          entity_id: input_number.max_soc_eco
        data:
          value: '{{ states(''input_number.max_soc_eco_high'') | float(0) }}'
        action: input_number.set_value
      - data:
          message: Setting Max SoC ECO to {{ states('input_number.max_soc_eco_high')
            }}% as PV forcast is {{ states('sensor.solcast_pv_forecast_forecast_tomorrow')
            }}kWh
          name: Max SoC ECO
        action: logbook.log
    - conditions:
      - condition: numeric_state
        entity_id: sensor.solcast_pv_forecast_forecast_tomorrow
        above: input_number.pv_forecastmed_threshold
      sequence:
      - target:
          entity_id: input_number.max_soc_eco
        data:
          value: '{{ states(''input_number.max_soc_eco_medium'') | float(0) }}'
        action: input_number.set_value
      - data:
          message: Setting Max SoC ECO to {{ states('input_number.max_soc_eco_medium')
            }}% as PV forcast is {{ states('sensor.solcast_pv_forecast_forecast_tomorrow')
            }}kWh
          name: Max SoC ECO
        action: logbook.log
    - conditions:
      - condition: numeric_state
        entity_id: sensor.solcast_pv_forecast_forecast_tomorrow
        above: input_number.pv_forecastlow_threshold
      sequence:
      - target:
          entity_id: input_number.max_soc_eco
        data:
          value: '{{ states(''input_number.max_soc_eco_low'') | float(0) }}'
        action: input_number.set_value
      - data:
          message: Setting Max SoC ECO to {{ states('input_number.max_soc_eco_low')
            }}% as PV forcast is {{ states('sensor.solcast_pv_forecast_forecast_tomorrow')
            }}kWh
          name: Max SoC ECO
        action: logbook.log
    default:
    - target:
        entity_id: input_number.max_soc_eco
      data:
        value: '{{ states(''input_number.max_soc_eco_default'') | float(0) }}'
      action: input_number.set_value
    - data:
        message: Setting Max SoC ECO to default {{ states('input_number.max_soc_eco_default')
          }}% PV forcast is {{ states('sensor.solcast_pv_forecast_forecast_tomorrow')
          }}kWh - check why default?
        name: Max SoC ECO
      action: logbook.log
  - data:
      entity_id: calendar.home_assistant
      summary: Forecast PV = {{ states('sensor.solcast_pv_forecast_forecast_tomorrow')
        }}kWh Max SoC ECO = {{ states('input_number.max_soc_eco') }}%
      start_date_time: '{{ now() }}'
      end_date_time: '{{ now() + timedelta(minutes=10) }}'
      location: '{{ states(''input_text.home_address'') }}'
    action: calendar.create_event
  - action: google_sheets.append_sheet
    continue_on_error: true
    data:
      config_entry: YOUR_GOOGLE_SHEETS_ENTRY_ID
      data:
        Log: PV Forecasts setting Max SoC ECO
        Detail: Tomorrow PV forecast {{ states('sensor.solcast_pv_forecast_forecast_tomorrow')
          }}kWh
        Detail 2: Todays actual PV {{ states('sensor.generation_today') }}kWh
  - data:
      message: Tomorrow's forecast PV = {{ states('sensor.solcast_pv_forecast_forecast_tomorrow')
        }} kWh Max SoC ECO set to {{ states('input_number.max_soc_eco') }}% for the
        overnight charge.
    action: notify.send_message
    target:
      entity_id: notify.email_me
  mode: single
- id: '1740673832275'
  alias: 'Energy: Reset the Max SoC ECO to default'
  description: ''
  triggers:
  - at: input_datetime.off_peak_energy_end
    trigger: time
  conditions: []
  actions:
  - target:
      entity_id: input_number.max_soc_eco
    data:
